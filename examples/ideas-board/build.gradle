plugins {
    id 'application'
    id 'java'
}

group = 'com.cockroachlabs.ideas'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'com.cockroachlabs.ideas.Main'
}

// tag::repo-maven[]
repositories {
    mavenCentral()
    // Anonymous, no-token CockroachDB Java library Maven feed (GitHub Pages).
    maven {
        name = 'cockroachdb-java-library'
        url = 'https://cockroachlabs.github.io/cockroachdb-java-library/maven/'
    }
}
// end::repo-maven[]

// tag::deps[]
dependencies {
    // The pure-Java library core: Crdb.tx(...) retry entry point, @FollowerRead,
    // Crdb.enhance(...). Pinned 0.4.0.
    implementation 'com.cockroachlabs:cockroachdb-java-library-core:0.4.0'

    // Metrics module: CrdbMetrics facade + InMemoryMetricsRecorder, counting
    // transactions and observe-bus retry events.
    implementation 'com.cockroachlabs:cockroachdb-java-library-metrics:0.4.0'

    // CDC module: CdcEventHandler, CdcEventDecoder, ChangefeedHandlerRegistry for
    // consuming CockroachDB changefeed webhook deliveries.
    implementation 'com.cockroachlabs:cockroachdb-java-library-cdc:0.4.0'

    // AI module: VectorStore + VectorDocument + DistanceMetric over CockroachDB's
    // native VECTOR type, for semantic / similarity search.
    implementation 'com.cockroachlabs:cockroachdb-java-library-ai:0.4.0'

    // A JDBC driver + DataSource for plain read-modify-write DAO code.
    implementation 'org.postgresql:postgresql:42.7.14'

    // Testing module: Testcontainers CockroachDB harness + concurrency runner.
    // Declared as implementation (not test-only) so Main can drive the same
    // ConcurrencyRunner the test uses; it stays available to the test too.
    implementation 'com.cockroachlabs:cockroachdb-java-library-testing:0.4.0'

    // JUnit 6 (matches the library's parent junitVersion 6.1.3).
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Mockito for the fast, no-DB unit test: mocks DataSource / Connection /
    // IdeaRepository so IdeaService logic is verified without Docker. 5.24.0
    // bundles a ByteBuddy that supports Java 25, and its inline mock maker
    // (default in Mockito 5) can mock the final IdeaRepository class.
    testImplementation 'org.mockito:mockito-core:5.24.0'
}
// end::deps[]

// Mockito's inline mock maker needs a Java agent. Self-attach works today but
// is deprecated on modern JDKs, so load mockito-core explicitly as an agent
// (the documented, future-proof setup) to keep the unit test clean on Java 25.
configurations {
    mockitoAgent
}
dependencies {
    mockitoAgent('org.mockito:mockito-core:5.24.0') { transitive = false }
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}
