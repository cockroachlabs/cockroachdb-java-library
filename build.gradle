plugins {
    id 'java-library'
    id 'net.ltgt.errorprone' version '5.2.0' apply false
}

// ---------------------------------------------------------------------------
// Shared dependency versions
// ---------------------------------------------------------------------------
ext {
    postgresqlVersion = '42.7.14'
    byteBuddyVersion  = '1.18.15'
    junitVersion      = '6.1.3'
    jacksonVersion    = '2.18.2'
}

allprojects {
    group = 'com.cockroachlabs'
    version = '0.4.0'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'net.ltgt.errorprone'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
        withJavadocJar()
        withSourcesJar()
    }

    dependencies {
        // Null safety, the way Spring Framework does it: every package is JSpecify
        // @NullMarked, carried as an api dependency so consumers see the contract.
        api 'org.jspecify:jspecify:1.0.0'

        errorprone 'com.google.errorprone:error_prone_core:2.52.0'
        errorprone 'com.uber.nullaway:nullaway:0.14.3'

        testImplementation "org.junit.jupiter:junit-jupiter:${rootProject.ext.junitVersion}"
        testRuntimeOnly   "org.junit.platform:junit-platform-launcher"
    }

    // NullAway (run through Error Prone) checks main sources at compile time;
    // tests are not checked. JSpecify mode honors @NullMarked / @Nullable.
    tasks.named('compileJava', JavaCompile) {
        options.errorprone {
            disableAllChecks = true
            option('NullAway:AnnotatedPackages', 'com.cockroachlabs')
            option('NullAway:JSpecifyMode', 'true')
            error('NullAway')
        }
    }
    tasks.named('compileTestJava', JavaCompile) {
        options.errorprone.enabled = false
    }

    test {
        useJUnitPlatform()
        testLogging {
            events 'passed', 'skipped', 'failed'
            exceptionFormat 'short'
        }
    }

    // The null-safety conventions test lives in core and checks every module's
    // packages, so give core's test task the whole library on a classpath
    // property (the same mechanism Spring uses, aggregated across modules).
    if (project.name == 'core') {
        def nullSafetyClasspath = rootProject.files({
            rootProject.subprojects.collect { it.sourceSets.main.output + it.sourceSets.main.compileClasspath }
        })
        test {
            dependsOn rootProject.subprojects.collect { "${it.path}:classes" }
            inputs.files(nullSafetyClasspath).withPropertyName('nullSafetyClasspath').withNormalizer(ClasspathNormalizer)
            jvmArgumentProviders.add({ ["-DnullSafety.classpath=${nullSafetyClasspath.asPath}".toString()] } as CommandLineArgumentProvider)
        }
    }

    // Publish every module to GitHub Packages (Maven) as
    // com.cockroachlabs:cockroachdb-java-library-<module>:<version>, each with a
    // Javadoc + sources jar. Credentials come from the Actions environment.
    publishing {
        publications {
            maven(MavenPublication) {
                artifactId = "cockroachdb-java-library-${project.name}"
                from components.java
                pom {
                    name = "CockroachDB Java Library — ${project.name}"
                    description = (project.description ?: 'CockroachDB Java library module')
                    url = 'https://github.com/cockroachlabs/cockroachdb-java-library'
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                }
            }
        }
        repositories {
            maven {
                name = 'GitHubPackages'
                url = 'https://maven.pkg.github.com/cockroachlabs/cockroachdb-java-library'
                credentials {
                    username = System.getenv('GITHUB_ACTOR')
                    password = System.getenv('GITHUB_TOKEN')
                }
            }
            // Anonymous static Maven repo published to GitHub Pages (no token to
            // consume). The Javadoc/Pages workflow copies this into _site/maven.
            maven {
                name = 'Pages'
                url = rootProject.layout.buildDirectory.dir('maven-repo')
            }
        }
    }
}
