plugins {
    id 'java-library'
}

// ---------------------------------------------------------------------------
// Shared dependency versions
// ---------------------------------------------------------------------------
ext {
    postgresqlVersion = '42.7.14'
    byteBuddyVersion  = '1.18.15'
    junitVersion      = '6.1.3'
    jacksonVersion    = '2.18.2'
}

allprojects {
    group = 'com.cockroachlabs'
    version = '0.1.1'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
        withJavadocJar()
        withSourcesJar()
    }

    dependencies {
        testImplementation "org.junit.jupiter:junit-jupiter:${rootProject.ext.junitVersion}"
        testRuntimeOnly   "org.junit.platform:junit-platform-launcher"
    }

    test {
        useJUnitPlatform()
        testLogging {
            events 'passed', 'skipped', 'failed'
            exceptionFormat 'short'
        }
    }

    // Publish every module to GitHub Packages (Maven) as
    // com.cockroachlabs:cockroachdb-java-library-<module>:<version>, each with a
    // Javadoc + sources jar. Credentials come from the Actions environment.
    publishing {
        publications {
            maven(MavenPublication) {
                artifactId = "cockroachdb-java-library-${project.name}"
                from components.java
                pom {
                    name = "CockroachDB Java Library — ${project.name}"
                    description = (project.description ?: 'CockroachDB Java library module')
                    url = 'https://github.com/cockroachlabs/cockroachdb-java-library'
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                }
            }
        }
        repositories {
            maven {
                name = 'GitHubPackages'
                url = 'https://maven.pkg.github.com/cockroachlabs/cockroachdb-java-library'
                credentials {
                    username = System.getenv('GITHUB_ACTOR')
                    password = System.getenv('GITHUB_TOKEN')
                }
            }
        }
    }
}
