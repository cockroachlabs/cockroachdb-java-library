name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Start CockroachDB
        run: |
          docker run -d --name crdb -p 26257:26257 \
            cockroachdb/cockroach:latest-v25.1 start-single-node --insecure
          for i in $(seq 1 60); do
            if docker exec crdb ./cockroach sql --insecure -e 'SELECT 1' >/dev/null 2>&1; then
              echo "CockroachDB ready"; break
            fi
            sleep 2
          done

      - name: Build & test
        # Live-DB integration tests (*IT) run against the CockroachDB node above
        # via CRDB_URL; unit tests run regardless.
        env:
          CRDB_URL: jdbc:postgresql://localhost:26257/defaultdb?user=root&sslmode=disable
        run: ./gradlew build --no-daemon --stacktrace
