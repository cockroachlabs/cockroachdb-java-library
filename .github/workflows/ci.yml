name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build
        # Live-DB integration tests (*IT) are gated on a reachable CockroachDB
        # node via a JUnit assumption on CRDB_URL. No node is provisioned here,
        # so those tests self-skip and the build stays green. To run them in CI,
        # add a CockroachDB service and set CRDB_URL for this step.
        run: ./gradlew build --no-daemon --stacktrace
