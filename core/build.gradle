plugins {
    id 'java-library'
}

description = 'CockroachDB pure-Java library — annotation-driven core (retry, circuit breaking, context, transactions, dynamic proxies).'

dependencies {
    // Minimal core dependencies: the PostgreSQL wire driver + ByteBuddy for
    // class proxying. Everything else is the JDK.
    implementation "org.postgresql:postgresql:${rootProject.ext.postgresqlVersion}"
    implementation "net.bytebuddy:byte-buddy:${rootProject.ext.byteBuddyVersion}"
}

// Maven publishing (GitHub Packages) is configured centrally in the root
// build.gradle `subprojects` block for every module.
